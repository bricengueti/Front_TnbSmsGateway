<div class="ui-feature" [ngClass]="['ui-feature--' + size, 'ui-feature--' + tone]">
  <div class="ui-feature__icon">
    <span class="material-symbols-outlined">{{ icon }}</span>
  </div>
  <div class="ui-feature__text">
    <h4 class="ui-feature__title">{{ title }}</h4>
    <p class="ui-feature__desc">{{ description }}</p>
  </div>
</div>
