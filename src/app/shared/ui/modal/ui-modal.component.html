@if (open) {
  <div class="ui-modal-overlay" (click)="close()">
    <div class="ui-modal" [ngClass]="'ui-modal--' + width" (click)="$event.stopPropagation()">
      <div class="ui-modal__header">
        <h3>{{ title }}</h3>
        <button type="button" class="ui-modal__close" (click)="close()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="ui-modal__body">
        <ng-content />
      </div>
    </div>
  </div>
}
