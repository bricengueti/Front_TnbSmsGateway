<div class="ui-step" [ngClass]="'ui-step--' + tone">
  <div class="ui-step__icon">
    <span class="material-symbols-outlined">{{ icon }}</span>
  </div>
  <span class="ui-step__number">{{ step }}</span>
  <h3 class="ui-step__title">{{ title }}</h3>
  <p class="ui-step__desc">{{ description }}</p>
</div>
